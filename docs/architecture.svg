<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" font-family="Inter, system-ui, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#101828" flood-opacity="0.10"/>
    </filter>
    <style>
      .box   { fill:#ffffff; stroke:#e6e8ec; stroke-width:1.5; rx:14; filter:url(#shadow); }
      .grp   { fill:#f7f9fc; stroke:#dfe3ea; stroke-width:1.5; stroke-dasharray:6 5; rx:16; }
      .title { fill:#111827; font-size:19px; font-weight:700; }
      .sub   { fill:#6b7280; font-size:13.5px; font-weight:500; }
      .lbl   { fill:#6b7280; font-size:12px; font-weight:700; letter-spacing:1.2px; }
      .api   { fill:#2563eb; stroke:#1d4ed8; }
      .apit  { fill:#ffffff; font-size:20px; font-weight:700; }
      .apis  { fill:#dbe6ff; font-size:13px; font-weight:500; }
      .edge  { stroke:#94a3b8; stroke-width:1.8; fill:none; }
      .edgeB { stroke:#2563eb; stroke-width:2.2; fill:none; }
      .elbl  { fill:#6b7280; font-size:12px; font-weight:600; }
    </style>
  </defs>

  <rect width="1280" height="820" fill="#f5f6f8"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#111827">Sanad <tspan fill="#2563eb">(سند)</tspan> — Architecture</text>
  <text x="40" y="74" font-size="15" fill="#6b7280">Self-hosted, grounded, trilingual (AR / FR / EN) support RAG — one script tag.</text>

  <!-- Browser group -->
  <rect class="grp" x="40" y="104" width="1200" height="120"/>
  <text class="lbl" x="58" y="126">BROWSER</text>
  <rect class="box" x="90" y="140" width="360" height="64"/>
  <text class="title" x="270" y="166" text-anchor="middle">widget.js</text>
  <text class="sub" x="270" y="188" text-anchor="middle">Shadow DOM · streaming · RTL</text>
  <rect class="box" x="830" y="140" width="360" height="64"/>
  <text class="title" x="1010" y="166" text-anchor="middle">React dashboard SPA</text>
  <text class="sub" x="1010" y="188" text-anchor="middle">documents · eval · settings</text>

  <!-- API -->
  <rect class="box api" x="440" y="286" width="400" height="86"/>
  <text class="apit" x="640" y="320" text-anchor="middle">FastAPI (async)</text>
  <text class="apis" x="640" y="344" text-anchor="middle">site key + Origin · cookie session + CSRF</text>

  <!-- edges browser -> api -->
  <path class="edge" d="M270,204 L270,250 L560,250 L560,286" marker-end="url(#arrow)"/>
  <path class="edge" d="M1010,204 L1010,250 L720,250 L720,286" marker-end="url(#arrow)"/>
  <text class="elbl" x="300" y="244">public site key</text>
  <text class="elbl" x="860" y="244">cookie + CSRF</text>

  <!-- Core: retrieval -->
  <rect class="box" x="440" y="420" width="400" height="70"/>
  <text class="title" x="640" y="450" text-anchor="middle">Hybrid retrieval</text>
  <text class="sub" x="640" y="472" text-anchor="middle">dense + full-text + RRF · refusal thresholds</text>
  <path class="edge" d="M640,372 L640,420" marker-end="url(#arrow)"/>

  <!-- Data & models row -->
  <rect class="box" x="70" y="560" width="330" height="80"/>
  <text class="title" x="235" y="592" text-anchor="middle">PostgreSQL + pgvector</text>
  <text class="sub" x="235" y="614" text-anchor="middle">BGE-M3 dense + full-text</text>

  <rect class="box" x="475" y="560" width="330" height="80"/>
  <text class="title" x="640" y="592" text-anchor="middle">Cross-encoder reranker</text>
  <text class="sub" x="640" y="614" text-anchor="middle">medium / large tiers</text>

  <rect class="box" x="880" y="560" width="330" height="80"/>
  <text class="title" x="1045" y="586" text-anchor="middle">Ollama · Qwen3 / Qwen2.5</text>
  <text class="sub" x="1045" y="606" text-anchor="middle">grounded answer + [n] citations</text>
  <text class="sub" x="1045" y="624" text-anchor="middle">(or OpenAI-compatible API)</text>

  <path class="edge" d="M560,490 L560,520 L235,520 L235,560" marker-end="url(#arrow)"/>
  <path class="edge" d="M640,490 L640,560" marker-end="url(#arrow)"/>
  <path class="edge" d="M720,490 L720,520 L1045,520 L1045,560" marker-end="url(#arrow)"/>

  <!-- Redis + handoff -->
  <rect class="box" x="70" y="700" width="330" height="70"/>
  <text class="title" x="235" y="730" text-anchor="middle">Redis</text>
  <text class="sub" x="235" y="752" text-anchor="middle">cache · rate limits · sessions</text>

  <rect class="box" x="880" y="700" width="330" height="70"/>
  <text class="title" x="1045" y="730" text-anchor="middle">Human handoff</text>
  <text class="sub" x="1045" y="752" text-anchor="middle">SMTP email / Telegram</text>

  <path class="edge" d="M440,340 L120,340 L120,700" marker-end="url(#arrow)"/>
  <path class="edge" d="M840,340 L1160,340 L1160,700" marker-end="url(#arrow)"/>

  <!-- answer back to widget -->
  <path class="edgeB" d="M1210,590 L1245,590 L1245,120 L450,120" marker-end="url(#arrowBlue)"/>
  <text class="elbl" x="850" y="112" text-anchor="middle" fill="#2563eb">answer + citations → visitor</text>
</svg>
