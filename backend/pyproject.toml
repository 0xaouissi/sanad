[project]
name = "sanad-backend"
version = "0.2.0"
description = "Sanad backend: self-hosted, grounded RAG chatbot API (FastAPI)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "structlog>=24.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
    "lingua-language-detector>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]
ocr = [
    "pytesseract>=0.3.10",
    "pypdfium2>=4.30",
    "Pillow>=10.0",
]
embeddings = [
    "FlagEmbedding>=1.3",
    "huggingface_hub>=0.24",
]
browser = [
    "playwright>=1.44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not e2e and not integration'"
markers = [
    "e2e: live end-to-end tests requiring a running Ollama with the tier model pulled",
    "integration: tests requiring PostgreSQL with pgvector and the BGE-M3 model downloaded",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]